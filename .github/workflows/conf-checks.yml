name: CONF regression checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Chronological goal-model audit
        run: node scripts/backtest-goals.js
      - name: Compare experimental Poisson variants on holdout
        run: node scripts/model-candidates.js
      - name: Evaluate independent logistic model
        run: node scripts/logistic-candidate.js
      - name: Replay default provider across covered competitions
        run: node scripts/validate-coverage.js
      - name: Compare chronological calibration candidates
        run: node scripts/calibrate-goals.js
      - name: Boot and smoke-test web app
        run: node scripts/smoke-app.js
